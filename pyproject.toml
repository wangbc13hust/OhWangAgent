[project]
name = "ohwang-agent"
version = "0.2.0"
description = "OhWangAgent — a Claude-Code-style coding agent in Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.0",
    "rich>=13.0",
    "httpx>=0.27",
    "markdownify>=0.14",
    "textual>=3.0",
    "tiktoken>=0.7",
]

[project.scripts]
ohwang = "ohwang.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
tui = ["textual>=3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ohwang*"]
